# Nginx server block for the Aureus TalosFacilitator.
#
# Install:
#   sudo cp deploy/aureus.auranode.xyz.conf /etc/nginx/sites-available/aureus.auranode.xyz
#   sudo ln -s /etc/nginx/sites-available/aureus.auranode.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Cert (run AFTER first reload while server block listens on :80 only,
# certbot will then convert it to :443 with TLS):
#   sudo certbot --nginx -d aureus.auranode.xyz

# Rate limit pool — applied per IP, scoped to this server.
# 20 r/s per IP, 10 MB shared zone (~160k unique IPs tracked).
limit_req_zone $binary_remote_addr zone=aureus_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name aureus.auranode.xyz;

    # certbot adds the redirect to :443 after issuing the cert.
    # Until then this serves the ACME challenge over HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aureus.auranode.xyz;

    # certbot fills these in. Initial value here is a placeholder; certbot
    # rewrites this file to point at /etc/letsencrypt/live/aureus.auranode.xyz/.
    ssl_certificate     /etc/letsencrypt/live/aureus.auranode.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aureus.auranode.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AureusSSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow x402 buyers (browsers, agents) to read response headers.
    add_header Access-Control-Expose-Headers "X-PAYMENT-RESPONSE" always;

    # Body size — payment payloads are tiny (<2 KB).
    client_max_body_size 32k;

    # Logs (rotate via logrotate)
    access_log /var/log/nginx/aureus.access.log;
    error_log  /var/log/nginx/aureus.error.log warn;

    location / {
        # Rate limit: 20 r/s sustained, allow 40 burst, no delay.
        limit_req zone=aureus_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8402;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Settlement may take ~1s on Arc; give 60s ceiling for safety.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer responses (stream JSON straight through).
        proxy_buffering off;
    }

    # Health/info endpoints — no rate limit, useful for monitoring.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8402/health;
    }
}
