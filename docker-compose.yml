services:
  facilitator:
    build:
      context: .
      dockerfile: facilitator/Dockerfile
    image: aureus-facilitator:latest
    container_name: aureus-facilitator
    restart: unless-stopped

    # Bind to 127.0.0.1 only — Nginx fronts HTTPS on the host.
    ports:
      - "127.0.0.1:8402:8402"

    environment:
      NODE_ENV: production
      PORT: 8402
      ARC_RPC_URL: https://rpc.testnet.arc.network

    # FACILITATOR_PRIVATE_KEY lives ONLY in this file on the server,
    # never committed to the repo (.env is in .gitignore).
    env_file:
      - facilitator/.env

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:8402/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
