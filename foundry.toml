[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# via_ir handles deep stacks (events with many args) and produces cheaper bytecode.
# Slightly slower compile but standard for production-grade contracts.
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
arc-testnet = "https://rpc.testnet.arc.network"
